name: First action that post a welcome comment
on:
  pull_request:
    types: [opened]
  permissions:
    pull-requests: write
  jobs:
    welcome:
      name: My first job named welcome
      runs-on: ubuntu-latest
      steps:
        - run: gh pr comment "$PR_URL" --body "First step in my first job"
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            PR_URL: ${{ github.event.pull_request.html_url }}
  
